---
all:
  vars:
    report_state_dir: /var/lib/security-report
    report_web_dir: /usr/share/nginx/html/security-report
  children:
    report_targets:
      vars:
        ansible_user: ansible-report
        ansible_ssh_private_key_file: /home/ansible-report/.ssh/security-report-ed25519
        ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=yes"
        report_python: /usr/bin/python3
      hosts:
        rhel-app-01:
          ansible_host: 192.0.2.10
          report_allowed_listeners:
            - tcp:22
            - tcp:443
