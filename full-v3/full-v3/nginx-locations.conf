location = /full-v3 { return 301 /full-v3/; }
location = /full-v3/ { try_files /full-v3/index.html =404; }
location = /full-v3/security-report.csv { }
location ~ "^/full-v3/snapshots/[a-f0-9]{32}/hosts/[a-f0-9]{64}\.html$" { try_files $uri =404; }
location ~ "^/full-v3/snapshots/[a-f0-9]{32}/cves/(CVE-[0-9]{4}-[0-9]{4,}|ready)\.json$" { try_files $uri =404; }
location = /full-v3/metrics {
    types { }
    default_type "text/plain; version=0.0.4";
    try_files $uri =404;
}
